[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sycophancy-confidence"
version = "0.2.0"
description = "Reproducible user-confidence experiments, evaluation, and paired statistical analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
research = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "statsmodels==0.14.4",
    "matplotlib==3.10.3",
    "scikit-learn==1.6.1",
]

[project.scripts]
prepare-sycophancy-dataset = "sycophancy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sycophancy = ["review_ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
